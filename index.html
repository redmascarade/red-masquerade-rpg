<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Red Masquerade</title>

  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <header class="topo">
    <a href="index.html" class="logo">
      RED MASQUERADE
    </a>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>


  <!-- FUNDO INTERATIVO -->
  <div class="menu-fundo" id="menuFundo">

    <div class="luz-mouse"></div>

    <div class="circulo circulo-1"></div>
    <div class="circulo circulo-2"></div>

    <!-- CARTAS -->
    <div class="carta carta-1">
      <div class="naipe">♠</div>
      <small>RED MASQUERADE</small>
    </div>

    <div class="carta carta-2">
      <div class="naipe">♥</div>
      <small>RED MASQUERADE</small>
    </div>

    <div class="carta carta-3">
      <div class="naipe">♦</div>
      <small>RED MASQUERADE</small>
    </div>

    <div class="carta carta-4">
      <div class="naipe">♣</div>
      <small>RED MASQUERADE</small>
    </div>


    <!-- MÁSCARA -->
    <div class="mascara">
      <div class="olho olho-1"></div>
      <div class="olho olho-2"></div>
    </div>


    <!-- CONTEÚDO DO MENU -->
    <main class="menu-conteudo">

      <p class="menu-eyebrow">
        RED MASQUERADE
      </p>

      <h1>
        O <span>UNIVERSO</span>
      </h1>

      <div class="linha-menu"></div>


      <nav class="menu-lista">

        <a href="fraternidades.html" class="menu-item">
          <span class="numero">01</span>
          <span class="nome">As Fraternidades</span>
          <span class="seta">→</span>
        </a>

        <a href="casas.html" class="menu-item">
          <span class="numero">02</span>
          <span class="nome">As Casas</span>
          <span class="seta">→</span>
        </a>

        <a href="mundo.html" class="menu-item">
          <span class="numero">03</span>
          <span class="nome">O Mundo</span>
          <span class="seta">→</span>
        </a>

        <a href="regras.html" class="menu-item">
          <span class="numero">04</span>
          <span class="nome">Regras do Jogo</span>
          <span class="seta">→</span>
        </a>

      </nav>

    </main>

  </div>


  <script>

    const menuBtn = document.getElementById("menuBtn");
    const menuFundo = document.getElementById("menuFundo");

    let menuAberto = false;


    menuBtn.addEventListener("click", function () {

      menuAberto = !menuAberto;

      if (menuAberto) {

        menuFundo.classList.add("aberto");
        menuBtn.classList.add("fechar");

        menuBtn.setAttribute(
          "aria-label",
          "Fechar menu"
        );

      } else {

        menuFundo.classList.remove("aberto");
        menuBtn.classList.remove("fechar");

        menuBtn.setAttribute(
          "aria-label",
          "Abrir menu"
        );

      }

    });


    /* EFEITO DE MOVIMENTO */

    document.addEventListener("pointermove", function(e) {

      const x = e.clientX;
      const y = e.clientY;

      document.documentElement.style.setProperty(
        "--mouse-x",
        x + "px"
      );

      document.documentElement.style.setProperty(
        "--mouse-y",
        y + "px"
      );

    });


    /* EFEITO NAS CARTAS */

    const cartas = document.querySelectorAll(".carta");

    document.addEventListener("pointermove", function(e) {

      const x = (e.clientX / window.innerWidth - 0.5);
      const y = (e.clientY / window.innerHeight - 0.5);

      cartas.forEach(function(carta, index) {

        const intensidade = (index + 1) * 3;

        carta.style.transform =
          "translate(" +
          (x * intensidade) +
          "px, " +
          (y * intensidade) +
          "px) rotate(" +
          carta.dataset.rotacao +
          "deg)";

      });

    });


    cartas.forEach(function(carta) {

      const rotacoes = [-12, 9, -7, 13];

      const index =
        Array.from(cartas).indexOf(carta);

      carta.dataset.rotacao =
        rotacoes[index];

    });


    /* TOQUE NOS ITENS */

    const itens =
      document.querySelectorAll(".menu-item");

    itens.forEach(function(item) {

      item.addEventListener("pointerdown", function() {

        item.classList.add("tocando");

      });

      item.addEventListener("pointerup", function() {

        item.classList.remove("tocando");

      });

    });

  </script>

</body>
</html>
