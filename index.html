<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050405">

  <title>Red Masquerade</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --preto: #050405;
      --vinho: #26070d;
      --vermelho: #8e1f32;
      --vermelho-claro: #bd3048;
      --dourado: #c3a46a;
      --dourado-claro: #e2c98e;
      --creme: #f0e8dc;
      --cinza: #a79d94;
      --linha: rgba(240, 232, 220, .15);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--preto);
    }

    body {
      color: var(--creme);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =====================================================
       FUNDO PRINCIPAL
       ===================================================== */

    .site {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 72% 48%,
          rgba(110, 18, 35, .18),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(55, 5, 15, .28),
          transparent 35%
        ),
        var(--preto);
    }

    /* =====================================================
       RUÍDO
       ===================================================== */

    .noise {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .035;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    /* =====================================================
       LUZ
       ===================================================== */

    .cursor-light {
      position: absolute;

      width: 420px;
      height: 420px;

      left: var(--mouse-x, 70%);
      top: var(--mouse-y, 50%);

      transform: translate(-50%, -50%);

      pointer-events: none;
      z-index: 1;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(157, 31, 53, .12),
          rgba(157, 31, 53, .04) 35%,
          transparent 70%
        );

      filter: blur(10px);

      transition:
        left .35s ease-out,
        top .35s ease-out;
    }

    /* =====================================================
       CÍRCULOS
       ===================================================== */

    .orbit {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 1;
    }

    .orbit-one {
      width: 760px;
      height: 760px;

      right: -290px;
      top: 8%;

      border: 1px solid rgba(195, 164, 106, .18);

      animation:
        orbitFloat 14s ease-in-out infinite;
    }

    .orbit-two {
      width: 470px;
      height: 470px;

      right: -130px;
      top: 27%;

      border: 1px solid rgba(142, 31, 50, .34);

      animation:
        orbitFloat 10s ease-in-out infinite reverse;
    }

    .orbit-three {
      width: 250px;
      height: 250px;

      right: 2%;
      top: 38%;

      border: 1px solid rgba(195, 164, 106, .08);

      animation:
        orbitFloat 8s ease-in-out infinite;
    }

    @keyframes orbitFloat {

      0%,
      100% {
        transform:
          translate(0, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate(-15px, 12px)
          rotate(5deg);
      }
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .topo {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 82px;

      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 30;

      border-bottom: 1px solid var(--linha);

      background:
        linear-gradient(
          to bottom,
          rgba(5, 4, 5, .94),
          rgba(5, 4, 5, .70)
        );

      backdrop-filter: blur(12px);
    }

    .logo {
      position: relative;

      color: var(--creme);

      font-size: 16px;
      font-weight: bold;

      letter-spacing: 5px;

      transition: .4s ease;
    }

    .logo::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: var(--dourado);

      transition: .5s ease;
    }

    .logo:hover {
      color: var(--dourado-claro);
    }

    .logo:hover::after {
      width: 100%;
    }

    .menu-btn {
      position: relative;

      width: 50px;
      height: 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 6px;

      color: var(--creme);

      background: transparent;

      border: 1px solid var(--linha);

      cursor: pointer;

      transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease;
    }

    .menu-btn span {
      display: block;

      width: 22px;
      height: 2px;

      background: var(--creme);

      transition: .3s ease;
    }

    .menu-btn:hover {
      background: rgba(195, 164, 106, .08);
      border-color: rgba(195, 164, 106, .5);

      transform: translateY(-2px);
    }

    /* =====================================================
       CARTAS
       ===================================================== */

    .cards {
      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;
    }

    .card {
      position: absolute;

      width: 92px;
      height: 132px;

      padding: 8px;

      border: 1px solid rgba(195, 164, 106, .35);

      background:
        linear-gradient(
          145deg,
          rgba(28, 17, 18, .94),
          rgba(8, 6, 7, .98)
        );

      box-shadow:
        0 20px 50px rgba(0, 0, 0, .45),
        inset 0 0 20px rgba(142, 31, 50, .06);

      opacity: .72;

      transition:
        transform .5s cubic-bezier(.2, .8, .2, 1),
        opacity .4s ease;
    }

    .card::before {
      content: "♠";

      position: absolute;
      inset: 7px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(195, 164, 106, .12);

      color: var(--vermelho-claro);

      font-size: 31px;
    }

    .card::after {
      content: "RED MASQUERADE";

      position: absolute;

      left: 50%;
      bottom: 10px;

      transform: translateX(-50%);

      white-space: nowrap;

      font-family: Arial, sans-serif;

      font-size: 5px;
      letter-spacing: 2px;

      color: rgba(240, 232, 220, .4);
    }

    .card-1 {
      left: 7%;
      top: 19%;

      transform: rotate(-17deg);

      animation:
        cardFloat1 8s ease-in-out infinite;
    }

    .card-2 {
      right: 11%;
      top: 17%;

      transform:
        rotate(15deg)
        scale(.82);

      animation:
        cardFloat2 10s ease-in-out infinite;
    }

    .card-3 {
      left: 9%;
      bottom: 11%;

      transform:
        rotate(12deg)
        scale(.7);

      animation:
        cardFloat3 9s ease-in-out infinite;
    }

    .card-4 {
      right: 6%;
      bottom: 13%;

      transform:
        rotate(-12deg)
        scale(.88);

      animation:
        cardFloat4 11s ease-in-out infinite;
    }

    @keyframes cardFloat1 {

      0%,
      100% {
        margin-top: 0;
        margin-left: 0;
      }

      50% {
        margin-top: -22px;
        margin-left: 12px;
      }
    }

    @keyframes cardFloat2 {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: 28px;
      }
    }

    @keyframes cardFloat3 {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -18px;
      }
    }

    @keyframes cardFloat4 {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: 20px;
      }
    }

    /* =====================================================
       MÁSCARA
       ===================================================== */

    .mask-area {
      position: absolute;

      right: 7%;
      top: 50%;

      width: 330px;
      height: 230px;

      transform:
        translateY(-50%)
        rotate(-5deg);

      z-index: 3;

      pointer-events: none;

      opacity: .5;
    }

    .mask {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 280px;
      height: 125px;

      transform:
        translate(-50%, -50%)
        perspective(500px)
        rotateY(-8deg);

      background:
        linear-gradient(
          160deg,
          #171315 0%,
          #080708 50%,
          #1d1114 100%
        );

      border:
        2px solid rgba(195, 164, 106, .48);

      border-radius:
        50% 50%
        42% 42%
        / 45% 45%
        55% 55%;

      box-shadow:
        0 0 35px rgba(142, 31, 50, .22),
        inset 0 0 30px rgba(195, 164, 106, .05);
    }

    .mask::before,
    .mask::after {
      content: "";

      position: absolute;

      top: 38px;

      width: 74px;
      height: 28px;

      background: var(--preto);

      border:
        1px solid rgba(195, 164, 106, .25);

      border-radius: 50%;

      box-shadow:
        0 0 18px rgba(142, 31, 50, .2);
    }

    .mask::before {
      left: 39px;
      transform: rotate(8deg);
    }

    .mask::after {
      right: 39px;
      transform: rotate(-8deg);
    }

    .mask-nose {
      position: absolute;

      left: 50%;
      top: 37px;

      width: 25px;
      height: 58px;

      transform:
        translateX(-50%)
        rotate(2deg);

      border-left:
        1px solid rgba(195, 164, 106, .38);

      border-right:
        1px solid rgba(195, 164, 106, .14);

      border-radius: 50%;
    }

    .mask-feather {
      position: absolute;

      left: 44%;
      top: -85px;

      width: 2px;
      height: 110px;

      background:
        linear-gradient(
          to top,
          var(--dourado),
          transparent
        );

      transform: rotate(22deg);

      opacity: .55;
    }

    .mask-glow {
      position: absolute;

      inset: -40px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(142, 31, 50, .17),
          transparent 65%
        );

      filter: blur(12px);

      animation:
        maskGlow 4s ease-in-out infinite;
    }

    @keyframes maskGlow {

      0%,
      100% {
        opacity: .5;
        transform: scale(.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    /* =====================================================
       HERO
       ===================================================== */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;

      min-height: 600px;

      display: flex;
      align-items: center;

      z-index: 5;
    }

    .hero-content {
      position: relative;

      width: min(720px, 86%);

      margin-left: 9%;

      padding-top: 45px;

      z-index: 8;
    }

    .eyebrow {
      margin-bottom: 22px;

      color: var(--vermelho-claro);

      font-family: Arial, sans-serif;

      font-size: 12px;
      font-weight: bold;

      letter-spacing: 7px;

      opacity: 0;

      animation:
        revealUp .9s .15s forwards;
    }

    /* =====================================================
       TÍTULO
       ===================================================== */

    .hero h1 {
      position: relative;

      width: 100%;

      font-size:
        clamp(60px, 8vw, 116px);

      line-height: .82;

      letter-spacing: -5px;

      text-transform: uppercase;

      opacity: 0;

      animation:
        revealUp 1s .3s forwards;
    }

    .hero h1 .red {
      display: block;
      color: var(--creme);
    }

    .hero h1 .masquerade {
      display: block;

      color: var(--dourado);

      margin-left: -4px;

      white-space: nowrap;
    }

    .title-line {
      position: absolute;

      left: 0;
      bottom: -12px;

      width: 55%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          var(--dourado),
          transparent
        );

      opacity: .5;
    }

    /* =====================================================
       SUBTÍTULO
       ===================================================== */

    .subtitle {
      max-width: 500px;

      margin-top: 40px;

      color: var(--cinza);

      font-size: 21px;

      line-height: 1.55;

      opacity: 0;

      animation:
        revealUp .9s .5s forwards;
    }

    /* =====================================================
       BOTÃO
       ===================================================== */

    .enter {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 310px;
      height: 58px;

      margin-top: 38px;

      overflow: hidden;

      color: var(--creme);

      border: 1px solid var(--dourado);

      background: rgba(5, 4, 5, .45);

      font-family: Arial, sans-serif;

      font-size: 11px;
      letter-spacing: 4px;

      cursor: pointer;

      opacity: 0;

      animation:
        revealUp .9s .7s forwards;

      transition:
        color .35s ease,
        transform .35s ease,
        box-shadow .35s ease;
    }

    .enter::before {
      content: "";

      position: absolute;

      left: -110%;
      top: 0;

      width: 100%;
      height: 100%;

      background: var(--dourado);

      transition:
        left .45s cubic-bezier(.7, 0, .2, 1);

      z-index: -1;
    }

    .enter:hover {
      color: var(--preto);

      transform: translateY(-4px);

      box-shadow:
        0 12px 40px rgba(195, 164, 106, .16);
    }

    .enter:hover::before {
      left: 0;
    }

    .enter span {
      transition:
        transform .35s ease;
    }

    .enter:hover span {
      transform:
        translateX(7px);
    }

    @keyframes revealUp {

      from {
        opacity: 0;
        transform:
          translateY(28px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    /* =====================================================
       PARTÍCULAS
       ===================================================== */

    .particles {
      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 2px;
      height: 2px;

      border-radius: 50%;

      background: var(--dourado);

      box-shadow:
        0 0 8px rgba(195, 164, 106, .7);

      animation:
        particleFloat linear infinite;

      opacity: .4;
    }

    @keyframes particleFloat {

      0% {
        transform:
          translateY(40px)
          scale(.7);

        opacity: 0;
      }

      20% {
        opacity: .6;
      }

      80% {
        opacity: .3;
      }

      100% {
        transform:
          translateY(-180px)
          scale(1.2);

        opacity: 0;
      }
    }

    /* =====================================================
       TRANSIÇÃO
       ===================================================== */

    .transition {
      position: fixed;

      inset: 0;

      z-index: 100;

      background: var(--preto);

      pointer-events: none;

      opacity: 0;

      transition:
        opacity .8s ease;
    }

    .transition.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 900px) {

      .card-1 {
        left: -20px;
        top: 18%;

        opacity: .35;
      }

      .card-2 {
        right: -20px;
        top: 20%;

        opacity: .3;
      }

      .card-3,
      .card-4 {
        opacity: .25;
      }

      .mask-area {
        right: -90px;
        top: 54%;

        opacity: .3;

        transform:
          translateY(-50%)
          scale(.8);
      }

      .hero-content {
        margin-left: 7%;
        width: 86%;
      }
    }

    /* =====================================================
       CELULAR
       ===================================================== */

    @media (max-width: 600px) {

      .site {
        min-height: 560px;
      }

      .topo {
        height: 72px;
        padding: 0 22px;
      }

      .logo {
        font-size: 13px;
        letter-spacing: 4px;
      }

      .menu-btn {
        width: 44px;
        height: 44px;
      }

      .hero {
        align-items: center;
      }

      .hero-content {
        width: calc(100% - 44px);

        margin-left: 22px;

        padding-top: 30px;
      }

      .eyebrow {
        font-size: 10px;

        letter-spacing: 5px;

        margin-bottom: 20px;
      }

      /*
       * AQUI ESTÁ A CORREÇÃO PRINCIPAL.
       *
       * O título agora usa toda a largura disponível,
       * mas com tamanho menor no celular.
       */

      .hero h1 {
        width: 100%;
        max-width: 100%;

        font-size: 57px;

        line-height: .86;

        letter-spacing: -3px;
      }

      .hero h1 .red {
        font-size: 1em;
      }

      .hero h1 .masquerade {
        /*
         * Reduzimos somente MASQUERADE.
         * Assim ele continua grande, mas cabe.
         */

        font-size: 0.67em;

        letter-spacing: -1px;

        margin-left: 0;

        white-space: nowrap;
      }

      .title-line {
        bottom: -10px;

        width: 55%;
      }

      .subtitle {
        width: 100%;

        max-width: 330px;

        margin-top: 34px;

        font-size: 18px;

        line-height: 1.5;
      }

      .enter {
        width: 100%;

        height: 58px;

        margin-top: 34px;
      }

      .orbit-one {
        width: 620px;
        height: 620px;

        right: -350px;
        top: 23%;
      }

      .orbit-two {
        width: 410px;
        height: 410px;

        right: -160px;
        top: 36%;
      }

      .orbit-three {
        display: none;
      }

      .mask-area {
        width: 260px;
        height: 190px;

        right: -110px;
        top: 58%;

        opacity: .24;

        transform:
          translateY(-50%)
          scale(.75)
          rotate(-5deg);
      }

      .card-1 {
        left: -45px;
        top: 26%;

        transform:
          rotate(-18deg)
          scale(.6);

        opacity: .2;
      }

      .card-2 {
        right: -40px;
        top: 25%;

        transform:
          rotate(17deg)
          scale(.6);

        opacity: .18;
      }

      .card-3 {
        left: -40px;
        bottom: 10%;

        transform:
          rotate(12deg)
          scale(.5);

        opacity: .16;
      }

      .card-4 {
        right: -40px;
        bottom: 9%;

        transform:
          rotate(-12deg)
          scale(.55);

        opacity: .16;
      }

      .cursor-light {
        width: 300px;
        height: 300px;
      }
    }

    /* =====================================================
       CELULAR BAIXO
       ===================================================== */

    @media (max-height: 700px) and (max-width: 600px) {

      .hero-content {
        padding-top: 45px;
      }

      .eyebrow {
        margin-bottom: 14px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero h1 .masquerade {
        font-size: .67em;
      }

      .subtitle {
        margin-top: 27px;

        font-size: 16px;
      }

      .enter {
        margin-top: 24px;

        height: 52px;
      }
    }

    /* =====================================================
       CELULARES MUITO ESTREITOS
       ===================================================== */

    @media (max-width: 380px) {

      .hero-content {
        width: calc(100% - 36px);
        margin-left: 18px;
      }

      .hero h1 {
        font-size: 49px;

        letter-spacing: -2px;
      }

      .hero h1 .masquerade {
        font-size: .65em;
      }

      .subtitle {
        font-size: 16px;
      }

      .logo {
        font-size: 12px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>


<body>

  <div class="site">

    <!-- LUZ INTERATIVA -->
    <div class="cursor-light"></div>

    <!-- RUÍDO -->
    <div class="noise"></div>

    <!-- CÍRCULOS -->
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <div class="orbit orbit-three"></div>

    <!-- PARTÍCULAS -->
    <div
      class="particles"
      id="particles">
    </div>

    <!-- CARTAS -->
    <div class="cards">

      <div class="card card-1"></div>

      <div class="card card-2"></div>

      <div class="card card-3"></div>

      <div class="card card-4"></div>

    </div>

    <!-- MÁSCARA -->
    <div class="mask-area">

      <div class="mask-glow"></div>

      <div class="mask">

        <div class="mask-nose"></div>

        <div class="mask-feather"></div>

      </div>

    </div>


    <!-- HEADER -->
    <header class="topo">

      <a
        href="index.html"
        class="logo">
        RED MASQUERADE
      </a>

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Abrir menu">

        <span></span>
        <span></span>
        <span></span>

      </button>

    </header>


    <!-- HERO -->
    <main class="hero">

      <div class="hero-content">

        <p class="eyebrow">
          MOSCOW · RUSSIA
        </p>

        <h1>

          <span class="red">
            RED
          </span>

          <span class="masquerade">
            MASQUERADE
          </span>

          <span class="title-line"></span>

        </h1>

        <p class="subtitle">
          Um universo de histórias, segredos,
          escolhas e consequências.
        </p>

        <a
          href="fraternidades.html"
          class="enter"
          id="enterBtn">

          <span>
            ENTRAR NO UNIVERSO
          </span>

        </a>

      </div>

    </main>


    <!-- TRANSIÇÃO -->
    <div
      class="transition"
      id="transition">
    </div>

  </div>


  <script>

    /* =====================================================
       PARTÍCULAS
       ===================================================== */

    const particleContainer =
      document.getElementById("particles");

    for (let i = 0; i < 28; i++) {

      const particle =
        document.createElement("div");

      particle.className =
        "particle";

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.top =
        55 + Math.random() * 45 + "%";

      particle.style.animationDuration =
        (5 + Math.random() * 8) + "s";

      particle.style.animationDelay =
        (-Math.random() * 10) + "s";

      particle.style.opacity =
        .15 + Math.random() * .5;

      particleContainer.appendChild(
        particle
      );
    }


    /* =====================================================
       MOVIMENTO DO MOUSE
       ===================================================== */

    const site =
      document.querySelector(".site");

    const cards =
      document.querySelectorAll(".card");

    const maskArea =
      document.querySelector(".mask-area");


    document.addEventListener(
      "mousemove",
      (event) => {

        const mouseX =
          (event.clientX /
            window.innerWidth) * 100;

        const mouseY =
          (event.clientY /
            window.innerHeight) * 100;

        site.style.setProperty(
          "--mouse-x",
          mouseX + "%"
        );

        site.style.setProperty(
          "--mouse-y",
          mouseY + "%"
        );


        const centerX =
          window.innerWidth / 2;

        const centerY =
          window.innerHeight / 2;

        const moveX =
          (event.clientX - centerX) /
          centerX;

        const moveY =
          (event.clientY - centerY) /
          centerY;


        cards.forEach(
          (card, index) => {

            const strength =
              5 + index * 2;

            card.style.marginLeft =
              moveX * strength + "px";

            card.style.marginTop =
              moveY * strength + "px";

          }
        );


        maskArea.style.marginLeft =
          moveX * 7 + "px";

        maskArea.style.marginTop =
          moveY * 5 + "px";

      }
    );


    /* =====================================================
       MOVIMENTO NO CELULAR
       ===================================================== */

    document.addEventListener(
      "touchmove",
      (event) => {

        if (!event.touches.length) {
          return;
        }

        const touch =
          event.touches[0];

        const mouseX =
          (touch.clientX /
            window.innerWidth) * 100;

        const mouseY =
          (touch.clientY /
            window.innerHeight) * 100;

        site.style.setProperty(
          "--mouse-x",
          mouseX + "%"
        );

        site.style.setProperty(
          "--mouse-y",
          mouseY + "%"
        );

      },
      {
        passive: true
      }
    );


    /* =====================================================
       TRANSIÇÃO PARA O RPG
       ===================================================== */

    const enterBtn =
      document.getElementById("enterBtn");

    const transition =
      document.getElementById("transition");


    enterBtn.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        const destino =
          this.href;

        transition.classList.add(
          "active"
        );

        setTimeout(
          () => {

            window.location.href =
              destino;

          },
          700
        );

      }
    );


    /* =====================================================
       MENU
       ===================================================== */

    const menuBtn =
      document.getElementById("menuBtn");


    menuBtn.addEventListener(
      "click",
      () => {

        menuBtn.classList.toggle(
          "active"
        );

        if (
          menuBtn.classList.contains(
            "active"
          )
        ) {

          menuBtn.style.transform =
            "rotate(90deg)";

        } else {

          menuBtn.style.transform =
            "";

        }

      }
    );

  </script>

</body>

</html>
